<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favicon Generator - Harmatkert</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f3e7;
    }
    h1 { color: #4c6b5a; }
    .canvas-container {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .canvas-item {
      text-align: center;
      background: white;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #c8a24a;
    }
    canvas {
      border: 1px solid #ddd;
      display: block;
      margin: 10px auto;
    }
    button {
      background: #4c6b5a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #735b39;
    }
    .instructions {
      background: #fffaf0;
      border-left: 4px solid #c8a24a;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>💧🌿 Harmatkert Favicon Generator</h1>

  <div class="instructions">
    <strong>Instructions:</strong>
    <ol>
      <li>The favicons are automatically generated below</li>
      <li>Right-click each image and "Save Image As..."</li>
      <li>Save them to <code>assets/images/</code> with the filenames shown</li>
    </ol>
  </div>

  <div class="canvas-container">
    <div class="canvas-item">
      <h3>16x16</h3>
      <canvas id="favicon16" width="16" height="16"></canvas>
      <p><strong>favicon-16x16.png</strong></p>
      <button onclick="download('favicon16', 'favicon-16x16.png')">Download</button>
    </div>

    <div class="canvas-item">
      <h3>32x32</h3>
      <canvas id="favicon32" width="32" height="32"></canvas>
      <p><strong>favicon-32x32.png</strong></p>
      <button onclick="download('favicon32', 'favicon-32x32.png')">Download</button>
    </div>

    <div class="canvas-item">
      <h3>180x180</h3>
      <canvas id="apple180" width="180" height="180"></canvas>
      <p><strong>apple-touch-icon.png</strong></p>
      <button onclick="download('apple180', 'apple-touch-icon.png')">Download</button>
    </div>
  </div>

  <script>
    const colors = {
      gold: '#c8a24a',
      cream: '#fffdf7',
      sage: 'rgba(76, 107, 90, 0.08)'
    };

    function drawFavicon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      const centerX = size / 2;
      const ringCenterY = size * 0.42;
      const radius = ((size / 2) - 2) * 0.81; // 0.81x size (0.9 * 0.9)
      const innerRadius = radius * 0.8642; // r=35 when outer r=40.5 (35/40.5)

      // Fill background with cream
      ctx.fillStyle = colors.cream;
      ctx.beginPath();
      ctx.arc(centerX, ringCenterY, radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw inset shadow (inner circle)
      ctx.strokeStyle = colors.sage;
      ctx.lineWidth = size * 0.12;
      ctx.beginPath();
      ctx.arc(centerX, ringCenterY, innerRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Draw gold border
      ctx.strokeStyle = colors.gold;
      ctx.lineWidth = Math.max(1, size * 0.016);
      ctx.beginPath();
      ctx.arc(centerX, ringCenterY, radius, 0, Math.PI * 2);
      ctx.stroke();

      // Draw emojis
      const emojiSize = size * 0.41;
      ctx.font = `${emojiSize}px system-ui, -apple-system, "Segoe UI Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Water drop at y=28 (28% of 100 in SVG viewBox)
      ctx.fillText('💧', centerX, size * 0.28);

      // Leaf at y=79 (79% of 100 in SVG viewBox)
      ctx.fillText('🌿', centerX, size * 0.78);
    }

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Generate all favicons on load
    window.onload = function() {
      drawFavicon('favicon16', 16);
      drawFavicon('favicon32', 32);
      drawFavicon('apple180', 180);
    };
  </script>
</body>
</html>
