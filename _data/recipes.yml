- name: "Kakukkfűszörp"
  description: "1 liter kakukkfű főzet, 80-100 dkg cukor, 1 citrom leve. 12-24 óra áztatás után szűrd, cukrozd, röviden forrald, forrón üvegbe töltsd."

- name: "Hárs-kakukkfű szörp"
  description: "3 marék hársvirág, 1 marék kakukkfű, 1 liter víz, 80-100 dkg cukor, citrom."

- name: "Rétegezett kakukkfűméz"
  description: "Fonnyasztott kakukkfű és méz rétegezve. 2-4 hétig érleld sötét helyen."

- name: "Körömvirágolaj"
  description: "Szárított körömvirágot önts fel olívaolajjal, 4-6 hétig érleld, majd szűrd."
